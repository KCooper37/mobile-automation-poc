name: Mobile E2E Tests (Maestro)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  maestro-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Start Mock API Backend
        working-directory: ./apps/api
        run: |
          npm install
          npm start &
          sleep 3 # Wait for server to boot

      - name: Install Maestro
        run: curl -Ls "https://get.maestro.mobile.dev" | bash

      - name: Build Android APK (Expo Prebuild)
        working-directory: ./apps/mobile
        run: |
          npm install
          npx expo prebuild --platform android
          cd android && ./gradlew assembleDebug

      - name: Run Android Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: pixel_4
          script: |
            export PATH="$PATH:$HOME/.maestro/bin"
            # Install the built APK
            adb install apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
            # Run Maestro Test Suite
            cd apps/e2e-maestro
            maestro test checkout-flow.yaml
            maestro test order-lookup-flow.yaml
            maestro test save-cart-flow.yaml
            maestro test login-flow.yaml
            maestro test offline-flow.yaml
